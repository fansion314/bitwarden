name: Build AUR application archive

on:
  push:
    branches: [main]
    paths:
      - bitwarden-electron/**
      - .github/scripts/**
      - .github/workflows/release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch build and runtime dependencies
        run: |
          pacman -Syu --needed --noconfirm git asar nodejs electron \
            libnotify gnome-keyring libxtst libxss libnss_nis
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify package as an unprivileged user
        id: package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash .github/scripts/build.sh
          printf 'tag=%s\n' "$(cat dist/tag.txt)" >> "$GITHUB_OUTPUT"
      - name: Store application archive and internal metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-package
          path: dist/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arch-package
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          assets=(release/*.tar.zst)
          [[ ${#assets[@]} == 1 && -f "${assets[0]}" ]]
          [[ $(find release -mindepth 1 -maxdepth 1 | wc -l) -eq 1 ]]
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            draft=$(jq -r .isDraft release.json)
            if [[ "$draft" == true ]]; then
              target=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)
            else
              target=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            fi
            if [[ "$target" != "$COMMIT" ]]; then
              echo 'This version belongs to another commit; bump pkgrel before publishing.' >&2
              exit 1
            fi
            if [[ "$draft" == false ]]; then
              echo "Release $TAG is already published from this commit."
              exit 0
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --target "$COMMIT" \
              --title "Bitwarden system Electron ${TAG#v}" \
              --notes-file release-notes.md --draft
          fi
          gh release edit "$TAG" --draft=false --latest
          [[ $(gh release view "$TAG" --json assets --jq '.assets | length') == 1 ]]
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - name: Update the download-only recipe after publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ $(git rev-parse origin/main) != "$GITHUB_SHA" ]]; then
            echo 'main has advanced; keep the newer recipe rather than overwrite it.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp dist/bin-recipe/PKGBUILD PKGBUILD
          cp dist/bin-recipe/.SRCINFO .SRCINFO
          if git diff --quiet -- PKGBUILD .SRCINFO; then exit 0; fi
          git add PKGBUILD .SRCINFO
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: update prebuilt Bitwarden download and checksum'
          git push origin HEAD:main
